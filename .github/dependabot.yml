version: 2

updates:
  # Keeps SHA-pinned action versions current; rewrites the trailing "# vX.Y.Z"
  # comment on each bump so the pin stays auditable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "13:00"
      timezone: Europe/Berlin

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "13:00"
      timezone: Europe/Berlin
    ignore:
      # x/crypto v0.42.0+ raises its go directive to >= 1.24; the build pins
      # Go 1.23 (Makefile golang:1.23-alpine). Drop this once the toolchain bumps.
      - dependency-name: "golang.org/x/crypto"
        versions: [">= 0.42.0"]
