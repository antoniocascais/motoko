name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Newer pushes/PR updates supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # make test/lint run inside pinned Docker images (golang:1.23-alpine,
      # golangci-lint:v2.1.6), so the runner needs no Go toolchain and CI
      # matches local exactly.
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: make lint
